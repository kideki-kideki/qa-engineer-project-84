bugreports:
- summary: |
    При выборе категории "все товары" не работатает выбор по бренду
  environment: |
    Microsoft Edge 127.0.2651.86 (Официальная сборка) (64-разрядная версия)
    Windows 11 23H2
  steps-to-reproduce: |
      1. Нажать на "Категории"
      2. Выбрать "Все категории"
      3. Нажать на "Категории"
      4. Выбрать любой бренд
  expected-result: |
    Выводятся товары выбранного бренда
  actual-result: |
    Товары выбранного бренда не выводятся на странице. На странице показан список всех товаров

- summary: |
    При отключенном чекбоксе "Есть в наличии" не работают бренды 
  environment: |
    Microsoft Edge 127.0.2651.86 (Официальная сборка) (64-разрядная версия)
    Windows 11 23H2
  steps-to-reproduce: |
      1. Снять галочку с чекбокса "Есть в наличии"
      2. Выбрать любой бренд
  expected-result: |
    Выводятся товары выбранного бренда, которых нет и есть в наличии
  actual-result: |
    Страница остаётся статичной, товары выбранного бренда не выводятся на экран

- summary: |
    При вводе отрицательных значений в поиске по цене выводятся все товары
  environment: |
    Microsoft Edge 127.0.2651.86 (Официальная сборка) (64-разрядная версия)
    Windows 11 23H2
  steps-to-reproduce: |
      1. Открыть страницу с каталогом
      2. Ввести отрицательные значения или "0" в поиск по цене "от" и "до"
  expected-result: |
    Выводится ошибка "Товар не найден"
  actual-result: |
    На страницу выводятся все товары магазина
 
- summary: |
    Пропадают кнопки постраничного просмотра
  environment: |
    Microsoft Edge 127.0.2651.86 (Официальная сборка) (64-разрядная версия)
    Windows 11 23H2
  steps-to-reproduce: |
      1. Нажать на "Категории"
      2. Выбрать "Все категории"
  expected-result: |
    Кнопки перехода изображены на сайте
  actual-result: |
    Кнопки перехода пропадают

- summary: |
    В мобильной версии сайта все фильтры и поиск находится внизу страницы
  environment: |
    Microsoft Edge 127.0.2651.86 (Официальная сборка) (64-разрядная версия)
    Windows 11 23H2
  steps-to-reproduce: |
    1. С помощью инструментов разработчика открыть сайт с помощью мобильной версии
  expected-result: |
    Поиск и фильтры находятся вверху страницы
  actual-result: |
    Поиск и фильтры находятся внизу страницы
